<style>
  /* Same values as src/styles/tokens.css */
  :root {
    --paper: #ebeae6; --ink: #121212; --accent: #004FB8; --on-accent: #fff;
    --slate: #aab2bf; --on-slate: #fff; --mustard: #e3bd2d;
    --sans: Outfit, "Helvetica Neue", Helvetica, Arial, sans-serif;
    --mono: "JetBrains Mono", ui-monospace, Menlo, monospace;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 1200px; height: 630px; overflow: hidden; }
  body { position: relative; background: var(--paper); color: var(--ink); font-family: var(--sans); -webkit-font-smoothing: antialiased; }

  .rail { position: absolute; left: 28px; top: 28px; width: 64px; height: 574px; padding: 8px; border-radius: 32px;
    background: var(--accent); display: flex; flex-direction: column; gap: 8px; }
  .badge { flex: none; width: 48px; height: 48px; border-radius: 50%; background: var(--paper); display: flex; align-items: center; justify-content: center; }
  .panel { flex: 1; min-height: 0; overflow: hidden; border-radius: 24px; background: var(--paper); display: flex; align-items: center; justify-content: center; }
  .panel span { writing-mode: vertical-rl; transform: rotate(180deg); font: 600 11px/1 var(--sans); letter-spacing: .14em; text-transform: uppercase; white-space: nowrap; }

  .copy { position: absolute; left: 124px; top: 40px; width: 532px; height: 550px; display: flex; flex-direction: column; }
  .eyebrow { font: 700 15px/1.15 var(--sans); letter-spacing: .02em; text-transform: uppercase; }
  h1 { margin-top: 96px; font-weight: 500; font-size: 102px; line-height: .88; letter-spacing: -.045em; }
  h1 .line { display: flex; align-items: center; gap: .12em; }
  .bars { display: inline-flex; gap: .04em; }
  .bars i { width: .3em; height: .6em; border-radius: 0 .3em .3em 0; background: var(--ink); }
  .tagline { margin-top: 26px; font-size: 21px; line-height: 1.3; max-width: 500px; }
  .pills { margin-top: 22px; display: flex; flex-wrap: wrap; gap: 8px; list-style: none; }
  .pills li { padding: 7px 13px; border: 1.5px solid var(--ink); border-radius: 999px; font: 600 13px/1 var(--sans); letter-spacing: .04em; text-transform: uppercase; }
  .install { margin-top: auto; display: flex; align-items: center; gap: 12px; width: 440px; padding: 8px 8px 8px 22px; border-radius: 999px; background: var(--ink); color: var(--paper); }
  .install code { flex: 1; font: 500 17px var(--mono); }
  .install code b { color: var(--mustard); font-weight: 500; }
  .install span { padding: 11px 16px; border-radius: 999px; background: var(--accent); color: var(--on-accent); font: 600 13px/1 var(--sans); letter-spacing: .04em; text-transform: uppercase; }

  .card { position: absolute; left: 680px; top: 28px; width: 492px; height: 574px; }
  .card svg.plot { position: absolute; inset: 0; border-radius: 40px; background: var(--slate); }
  .grid { stroke: var(--mustard); stroke-width: 1; fill: none; }
  .cell { fill: var(--ink); font: 500 11px var(--mono); }
  .axis { stroke: var(--on-slate); stroke-width: 1.5; }
  .ring { fill: none; stroke: var(--on-slate); stroke-width: 2; }
  .dot { fill: var(--on-slate); }
  .ball { fill: var(--accent); }
  .lbl { fill: var(--on-slate); font: 500 13px var(--mono); }
  .cap { fill: var(--on-slate); font: 400 13px var(--sans); }
  .readout { fill: var(--on-slate); font: 500 16px var(--mono); }
  .barcode rect { fill: var(--on-slate); }
  .corner { position: absolute; right: -12px; top: -12px; width: 104px; height: 104px; border: 12px solid var(--paper); border-radius: 50%; background: var(--accent); }
</style>
</head>
